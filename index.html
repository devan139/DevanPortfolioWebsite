<script>
    gsap.registerPlugin(ScrollTrigger);

    // Hero Image entrance
    gsap.to("#mainImage", {
      opacity: 1,
      scale: 1,
      duration: 1.4,
      ease: "power3.out"
    });

    gsap.to("#heroText", {
      opacity: 1,
      y: 0, // Changed from -20 to 0 for a subtle upwards fade
      duration: 1,
      delay: 0.6,
      ease: "power2.out"
    });

    // Scroll animations for each section text
    const sections = [
      { id: "#aboutText", y: 50 },
      { id: "#projectsText", y: 50 },
      { id: "#contactText", y: 50 }
    ];

    sections.forEach(sec => {
      gsap.fromTo(sec.id, { opacity: 0, y: sec.y }, {
        opacity: 1, y: 0,
        duration: 1.2,
        ease: "power2.out",
        scrollTrigger: {
          trigger: sec.id,
          start: "top 85%",
          toggleActions: "play none none reverse"
        }
      });
    });

    // --- NEW ANIMATIONS ---

    // 1. Animate the new interactive object's container (fade in)
    gsap.fromTo("#interactiveObjectContainer", 
      { opacity: 0, y: 50 }, 
      {
        opacity: 1, y: 0,
        duration: 1.2,
        ease: "power2.out",
        scrollTrigger: {
          trigger: "#interactiveObjectContainer",
          start: "top 85%", // Same as the text for a coordinated entrance
          toggleActions: "play none none reverse"
        }
    });

    // 2. Add scroll-based rotation to the interactive object
    gsap.to("#interactiveObject", {
      rotation: 180, // REDUCED ROTATION: Now rotates 180 degrees as you scroll through the section
      ease: "none", // No easing, for a direct link to scroll
      scrollTrigger: {
        trigger: "#about", // The entire 'about' section
        start: "top top", // When the top of the section hits the top of the viewport
        end: "bottom bottom", // When the bottom of the section hits the bottom of the viewport
        scrub: 1.5, // Smoothly links scroll to animation (1.5 provides a slight lag)
        // markers: true // Uncomment this to see the start/end triggers
      }
    });
    
    // --- /NEW ANIMATIONS ---


    // Mouse movement parallax effect for hero image
    const image = document.getElementById("mainImage");
    // Only add this effect if the image exists
    if (image) {
      document.addEventListener("mousemove", (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 40;
        const y = (window.innerHeight / 2 - e.pageY) / 40;
        image.style.transform = `rotateY(${x}deg) rotateX(${y}deg) scale(1.02)`;
      });

      // Smooth return to normal when mouse leaves
      document.addEventListener("mouseleave", () => {
        image.style.transform = "rotateY(0deg) rotateX(0deg) scale(1)";
      });
    }
  </script>
